name: Build APKs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test --no-pub

      - name: Read app version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^version: *//p' pubspec.yaml | tr -d '\r')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]]
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Build universal testing APK
        env:
          APP_VERSION: ${{ steps.version.outputs.value }}
        run: |
          flutter build apk --debug --no-pub
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-debug.apk "dist/ArrowEscape-${APP_VERSION}-universal-debug.apk"

      - name: Build testing APKs for each architecture
        env:
          APP_VERSION: ${{ steps.version.outputs.value }}
        run: |
          flutter build apk --debug --split-per-abi --no-pub
          for abi in armeabi-v7a arm64-v8a x86_64; do
            cp "build/app/outputs/flutter-apk/app-${abi}-debug.apk" "dist/ArrowEscape-${APP_VERSION}-${abi}-debug.apk"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - name: Upload testing APKs
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ArrowEscape-${{ steps.version.outputs.value }}-debug-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Add download link to run summary
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          APP_VERSION: ${{ steps.version.outputs.value }}
        run: |
          {
            echo "## Arrow Escape ${APP_VERSION}"
            echo "[Download testing APKs](${ARTIFACT_URL})"
            echo ""
            echo "Use the universal APK on any supported device, or arm64-v8a on most modern phones."
            echo "These are debug-signed testing builds, not production releases."
          } >> "$GITHUB_STEP_SUMMARY"
